blueprint:
  name: Solar Battery Status (AWTRIX NG)
  description: |
    Shows the charge level of your solar battery on an Ulanzi TC001 (or compatible
    LED matrix) running **AWTRIX NG**, as a pushed app named `solar_battery`.

    Not compatible with AWTRIX 3 / SVITRIX (different MQTT topic and payload keys).

    ## What you see
    - **Icon:** battery icon in 20 % steps (`bat00` ... `bat100`), chosen by rounding the charge level to the nearest step.
    - **Text:** charge level in percent, colored by the same step.
    - **Progress bar:** bottom row, filled to the exact charge level.

    | Charge | Icon | Text color |
    |---|---|---|
    | 0-9 % | `bat00` | red `#ff0000` |
    | 10-29 % | `bat20` | orange `#ffcc00` |
    | 30-49 % | `bat40` | yellow `#ffff00` |
    | 50-69 % | `bat60` | yellow-green `#ccff00` |
    | 70-89 % | `bat80` | lime `#aaff00` |
    | 90-100 % | `bat100` | green `#00ff00` |

    **Progress bar color**
    - Without a battery power sensor: same color as the text.
    - With a battery power sensor (positive = charging, negative = discharging):
      green = charging, orange = discharging, white = idle (within the power tolerance).

    ## Requirements
    - AWTRIX NG with MQTT enabled and Home Assistant discovery on (the device must provide the `mqtt_prefix` sensor).
    - The six battery icons installed on the display (see below). Without them the text and bar still show, but the icon stays empty.

    ## Install the icons (once)
    1. Open https://awtrix.de/icons and search for `bat`.
    2. Open each of Bat00, Bat20, Bat40, Bat60, Bat80 and Bat100.
    3. Sign in to the AWTRIX Hub (free account) and click **Send to AWTRIX**, then choose your display. Your browser transfers the icon to the display over your local network.
    4. Alternative: in the display's web UI go to **Icons -> Add -> Open icon gallery**, or download the GIF and upload it to `/ICONS` with the web UI file manager.

    The icon ID is the file name without extension and is case-sensitive. The blueprint expects exactly
    the lowercase names `bat00`, `bat20`, `bat40`, `bat60`, `bat80` and `bat100` (check the file names in `/ICONS`).
    AWTRIX itself never downloads icons from the internet.

    ## Good to know
    - The app is updated on every change of the battery sensor and every 5 minutes. It disappears from the display after 6 minutes without an update.
    - Nothing is sent while the battery sensor is `unknown` or `unavailable`.
    - **Display position:** not part of the payload in AWTRIX NG. Set the app order once on the display (web UI or `PUT /api/v1/apps/order`); the app name is `solar_battery`.

    By https://github.com/foundnobetter/ha-blueprints
  domain: automation
  input:
    awtrix:
      name: AWTRIX NG Device
      description: Select your AWTRIX NG device(s) to show the battery data on
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Blueforcer
          multiple: true
    battery_sensor:
      name: Battery Level Sensor
      description: Choose the Home Assistant sensor that measures your battery charge level (in percent)
      selector:
        entity:
          filter:
            - domain:
                - sensor
          multiple: false
    battery_power_sensor:
      name: Battery Power Sensor
      description: Optional sensor for battery charge/discharge power. Positive = charging, negative = discharging. Used to color the progress bar.
      default: null
      selector:
        entity:
          filter:
            - domain:
                - sensor
          multiple: false
    power_tolerance:
      name: Power Tolerance (W)
      description: Treats values within ±this range as neutral power (no charging/discharging).
      default: 5
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: Watt
          mode: slider
          step: 1

mode: single

variables:
  device_ids: !input awtrix
  devices_topics: >-
    {%- macro get_device_topic(device_id) %}
      {%- set e = device_entities(device_id) | select('search','mqtt_prefix') | list %}
      {{- states(e[0]) if e else 'unknown' }}
    {%- endmacro %}
    {%- set ns = namespace(devices=[]) %}
    {%- for device_id in device_ids %}
      {%- set device = get_device_topic(device_id) | replace(' ','') | trim %}
      {%- if device not in ['unknown','unavailable',''] %}
        {%- set ns.devices = ns.devices + [ device ~ '/cmd/apps/pushed/solar_battery'] %}
      {%- endif %}
    {%- endfor %}
    {{ ns.devices }}
  battery_sensor: !input battery_sensor
  battery_power_sensor: !input battery_power_sensor
  power_tolerance: !input power_tolerance
  payload: >-
    {%- set soc = states(battery_sensor) | int(0) %}
    {%- set has_power_sensor = battery_power_sensor not in [none, ''] %}
    {%- set power = states(battery_power_sensor) | float(0) if has_power_sensor else 0 %}
    {%- set tolerance = power_tolerance | float(5) %}
    {%- set s = [0, [soc, 100] | min] | max %}
    {%- set level = ((s + 10) // 20) * 20 %}
    {%- set icon = 'bat' ~ ('%02d' | format(level)) %}
    {%- set colors = {0: "#ff0000", 20: "#ffcc00", 40: "#ffff00", 60: "#ccff00", 80: "#aaff00", 100: "#00ff00"} %}
    {%- set color = colors[level] %}
    {%- if has_power_sensor and power > tolerance %}
      {%- set progress_color = "#00ff00" %}
    {%- elif has_power_sensor and power < -tolerance %}
      {%- set progress_color = "#ff4e1a" %}
    {%- elif has_power_sensor %}
      {%- set progress_color = "#ffffff" %}
    {%- else %}
      {%- set progress_color = color %}
    {%- endif %}
    {{ {"icon": icon | string, "text": soc | string ~ "%", "textColor": color, "progress": soc, "progressColor": progress_color, "progressTrackColor": "#000000", "lifetimeMs": 360000} | to_json }}

triggers:
  - entity_id: !input battery_sensor
    trigger: state
  - minutes: /5
    trigger: time_pattern

conditions:
  - condition: template
    value_template: "{{ states(battery_sensor) not in ['unknown', 'unavailable'] }}"

actions:
  - repeat:
      for_each: "{{ devices_topics }}"
      sequence:
        - action: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: "{{ repeat.item }}"
            payload: "{{ payload }}"
